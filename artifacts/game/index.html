<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Monad Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #1a0535 0%, #06010f 70%);
      color: #e6e0ff; font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    html, body { overflow: auto; }
    #app {
      display: grid; grid-template-columns: 1fr 280px;
      gap: 16px;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      min-height: 100vh; min-height: 100dvh;
    }
    #left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 0; }
    .game-container {
      width: min(92vw, 420px);
      max-height: calc(100dvh - 140px);
      aspect-ratio: 2 / 3;
      margin: 0 auto;
      touch-action: none;
    }
    .game-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      justify-content: center;
      background: rgba(20,5,50,.6); border: 1px solid #5a2bb5;
      border-radius: 10px; padding: 8px 14px; font-size: 13px;
      box-shadow: 0 0 20px rgba(120,60,220,.3);
      max-width: 100%;
    }
    #hud .k { color: #b18cff; font-size: 11px; letter-spacing: 1px; }
    #hud .v { color: #fff; font-weight: bold; font-size: 16px; }
    #hpbar { width: 120px; height: 10px; background: #2a0a4a; border: 1px solid #6a3acf; border-radius: 4px; overflow: hidden; }
    #hpfill { height: 100%; background: linear-gradient(90deg, #ff3b6b, #ff9b2b); transition: width .15s; }
    #powers { display: flex; gap: 6px; }
    .pwr { padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #3a1a7a; border: 1px solid #7a4af0; }
    .pwr.shield { background: #1a4a7a; border-color: #4ad0f0; }
    .pwr.triple { background: #7a1a4a; border-color: #f04ad0; }
    .pwr.speed  { background: #4a7a1a; border-color: #d0f04a; }
    canvas {
      display: block; background: #06010f;
      border: 1px solid #5a2bb5; border-radius: 12px;
      box-shadow: 0 0 40px rgba(120,60,220,.4), inset 0 0 60px rgba(50,10,90,.4);
      max-width: 100%; max-height: calc(100vh - 100px);
    }
    #right {
      background: rgba(20,5,50,.6); border: 1px solid #5a2bb5;
      border-radius: 10px; padding: 14px; overflow-y: auto;
      box-shadow: 0 0 20px rgba(120,60,220,.3);
    }
    #right h2 { font-size: 14px; color: #b18cff; letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
    #lb-list { font-size: 12px; }
    .lb-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; padding: 6px 4px; border-bottom: 1px solid #2a1055; align-items: center; }
    .lb-row .rk { color: #b18cff; font-weight: bold; }
    .lb-row .nm { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row .sc { color: #f0c84a; font-weight: bold; }
    .lb-row.me { background: rgba(120,60,220,.2); border-radius: 4px; }
    #lb-status { font-size: 11px; color: #8a6acf; text-align: center; padding: 8px; }
    #overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(6,1,15,.85); backdrop-filter: blur(4px); z-index: 100;
    }
    #overlay.show { display: flex; }
    .panel {
      background: linear-gradient(180deg, #1a0535, #0a021a);
      border: 1px solid #7a4af0; border-radius: 14px;
      padding: 32px; min-width: 360px; text-align: center;
      box-shadow: 0 0 60px rgba(120,60,220,.5);
    }
    .panel h1 { font-size: 36px; color: #fff; margin-bottom: 8px; text-shadow: 0 0 20px #7a4af0; }
    .panel .sub { color: #b18cff; margin-bottom: 20px; font-size: 13px; letter-spacing: 1px; }
    .panel .stats { display: flex; gap: 20px; justify-content: center; margin: 16px 0; }
    .panel .stat { background: rgba(120,60,220,.15); padding: 10px 16px; border-radius: 8px; border: 1px solid #4a1a8a; }
    .panel .stat .l { font-size: 10px; color: #8a6acf; letter-spacing: 1px; }
    .panel .stat .n { font-size: 22px; color: #fff; font-weight: bold; }
    .panel input {
      background: #06010f; color: #fff; border: 1px solid #7a4af0;
      padding: 10px 12px; border-radius: 6px; font-size: 14px;
      width: 100%; margin: 10px 0; font-family: inherit;
    }
    .panel button {
      background: linear-gradient(180deg, #7a4af0, #4a1ac0);
      color: #fff; border: 0; padding: 12px 24px; border-radius: 8px;
      font-size: 14px; font-weight: bold; letter-spacing: 1px;
      cursor: pointer; margin: 4px; font-family: inherit;
      box-shadow: 0 4px 0 #2a0a80, 0 0 20px rgba(120,60,220,.5);
      transition: transform .1s;
    }
    .panel button:hover { transform: translateY(-2px); }
    .panel button:active { transform: translateY(2px); box-shadow: 0 0 0 #2a0a80; }
    .panel .hint { color: #8a6acf; font-size: 11px; margin-top: 12px; }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; gap: 10px; }
      #right { max-height: 240px; }
      #hud { gap: 10px; padding: 6px 10px; font-size: 12px; }
      #hud .v { font-size: 14px; }
      #hpbar { width: 80px; }
      .panel { min-width: 0; width: min(92vw, 360px); padding: 24px 20px; }
      .panel h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="left">
      <div id="hud">
        <div><div class="k">SCORE</div><div class="v" id="score">0</div></div>
        <div><div class="k">TIME</div><div class="v" id="time">0s</div></div>
        <div><div class="k">HP</div><div id="hpbar"><div id="hpfill" style="width:100%"></div></div></div>
        <div><div class="k">POWERS</div><div id="powers"></div></div>
      </div>
      <div class="game-container">
        <canvas id="game" width="480" height="720"></canvas>
      </div>
    </div>
    <div id="right">
      <h2>LEADERBOARD</h2>
      <div id="lb-list"></div>
      <div id="lb-status">Loading...</div>
    </div>
  </div>

  <div id="overlay" class="show">
    <div class="panel" id="panel">
      <h1>MONAD SHOOTER</h1>
      <div class="sub">SURVIVE THE SWARM</div>
      <div style="text-align:left; font-size:12px; color:#b18cff; margin: 16px 0; line-height: 1.8;">
        ← → ↑ ↓ Arrow keys to move<br>
        Auto-fire enabled — hold <b style="color:#00aaff">SPACE</b> for rapid fire<br>
        Collect power-ups, defeat the boss
      </div>
      <button id="startBtn">START</button>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
